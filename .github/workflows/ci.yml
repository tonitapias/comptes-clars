name: CI Comptes Clars

# Aquest workflow s'executarà cada vegada que facis push a la branca principal
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    name: Validació i Build
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Descarregar el codi
        uses: actions/checkout@v4

      - name: ⚙️ Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Utilitzem una versió LTS estable
          cache: 'npm'      # Això fa que les següents execucions siguin molt més ràpides

      - name: 📦 Instal·lar dependències
        run: npm ci

      - name: 🧹 Lint
        run: npm run lint

      - name: 🕵️‍♂️ Comprovar TypeScript (Sense compilar)
        run: npx tsc --noEmit

      - name: 🏗️ Comprovar que el Build de Vite funciona
        run: npm run build

      - name: 🧪 Executar Tests Unitaris
        run: npm run test -- --run

  rules:
    name: Regles de Firestore
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Descarregar el codi
        uses: actions/checkout@v4

      - name: ⚙️ Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # L'emulador de Firestore (dins de firebase-tools) exigeix JDK 21+;
      # el runner d'ubuntu-latest no en porta un prou modern per defecte.
      - name: ☕ Configurar Java (emulador de Firestore)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 📦 Instal·lar dependències
        run: npm ci

      - name: 🔒 Tests de firestore.rules (emulador local)
        run: npm run test:rules